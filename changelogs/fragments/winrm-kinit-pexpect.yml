bugfixes:
  - winrm - use the Python standard library to run ``kinit`` in a new session and send the password through stdin, ensuring consistent Kerberos authentication on macOS and with high file descriptor counts regardless of whether ``pexpect`` is installed.
  - winrm - pass only ``PATH`` and the temporary ``KRB5CCNAME`` to ``kinit``; ``ansible_winrm_kinit_env_vars`` is retained for compatibility and has no effect.
