DOCUMENTATION:
  name: human_to_bytes
  version_added: "historical"
  short_description: Get bytes from string
  description:
    - Convert a human-readable byte or bit string into a number of bytes or bits.
    - >-
      The input must start with an ASCII decimal number, optionally followed by ASCII spaces and a unit.
      Trailing ASCII spaces are allowed. Leading whitespace, non-ASCII digits, and additional text cause an error.
    - >-
      Units may be a single size prefix (V(B), V(K), V(M), V(G), V(T), V(P), V(E), V(Z), or V(Y)),
      an abbreviation such as V(KB), or a full name such as V(kilobyte) or V(kilobytes).
      Full names are case-insensitive. With O(isbits=true), use bit units such as V(Kb) or V(kilobit).
  positional: _input, default_unit, isbits
  options:
    _input:
      description: Human-readable description of a number of bytes or bits.
      type: str
      required: true
    default_unit:
      description: Unit to assume when input does not specify it.
      type: str
      choices: ['Y', 'Z', 'E', 'P', 'T', 'G', 'M', 'K', 'B']
    isbits:
      description: If V(True), interpret the input as bits; if V(False), interpret it as bytes. Single-letter units are accepted in either mode.
      type: bool
EXAMPLES: |

  # size => 1234803098
  size: '{{ "1.15 GB" | human_to_bytes }}'

  # size => 1234803098
  size: '{{ "1.15" | human_to_bytes(default_unit="G") }}'

  # this is an error, wants bits, got bytes
  ERROR: '{{ "1.15 GB" | human_to_bytes(isbits=true) }}'

RETURN:
  _value:
    description: Integer representing the bytes from the input.
    type: int
