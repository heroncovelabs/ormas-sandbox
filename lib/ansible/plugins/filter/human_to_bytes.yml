DOCUMENTATION:
  name: human_to_bytes
  version_added: "historical"
  short_description: Get bytes from string
  description:
    - Convert a human-readable byte or bit string into a number bytes.
  positional: _input, default_unit, isbits
  options:
    _input:
      description:
        - Human-readable description of a number of bytes or bits.
        - Must be a non-negative ASCII decimal number, optionally followed by ASCII spaces and a recognized unit, with optional trailing ASCII spaces.
        - Leading whitespace, non-ASCII digits, and extra text are not supported and cause an error.
        - Units may be single letters such as V(K), abbreviations such as V(KB) or V(Kb), or full names such as V(kilobyte) or V(kilobit).
        - Full unit names are case-insensitive and may be plural; the final V(B) or V(b) in abbreviations must match O(isbits).
      type: str
      required: true
    default_unit:
      description: Unit to assume when input does not specify it.
      type: str
      choices: ['Y', 'Z', 'E', 'P', 'T', 'G', 'M', 'K', 'B']
    isbits:
      description: If V(True), interpret the input as bits; otherwise interpret it as bytes.
      type: bool
      default: false
EXAMPLES: |

  # size => 1234803098
  size: '{{ "1.15 GB" | human_to_bytes }}'

  # size => 1234803098
  size: '{{ "1.15" | human_to_bytes(default_unit="G") }}'

  # this is an error, wants bits, got bytes
  ERROR: '{{ "1.15 GB" | human_to_bytes(isbits=true) }}'

RETURN:
  _value:
    description: Integer representing the bytes from the input.
    type: int
