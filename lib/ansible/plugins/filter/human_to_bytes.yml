DOCUMENTATION:
  name: human_to_bytes
  version_added: "historical"
  short_description: Get bytes from string
  description:
    - Convert a human-readable byte or bit string into a number bytes.
  positional: _input, default_unit, isbits
  options:
    _input:
      description:
        - An ASCII decimal number, optionally followed by a recognized unit and trailing ASCII spaces.
        - ASCII spaces may separate the number and unit. The number must begin at the start of the input.
        - Units may be a single size letter, such as V(K), an abbreviation, such as V(KB), or a full name, such as V(kilobyte) or V(kilobytes).
        - Full unit names are case-insensitive. Abbreviations use V(B) for bytes and V(b) for bits.
        - Malformed numbers and unrecognized units raise an error.
      type: str
      required: true
    default_unit:
      description: Unit to assume when input does not specify it.
      type: str
      choices: ['Y', 'Z', 'E', 'P', 'T', 'G', 'M', 'K', 'B']
    isbits:
      description: If V(True), force to interpret only bit input; if V(False), force bytes. Otherwise use the notation to guess.
      type: bool
EXAMPLES: |

  # size => 1234803098
  size: '{{ "1.15 GB" | human_to_bytes }}'

  # size => 1234803098
  size: '{{ "1.15" | human_to_bytes(default_unit="G") }}'

  # this is an error, wants bits, got bytes
  ERROR: '{{ "1.15 GB" | human_to_bytes(isbits=true) }}'

RETURN:
  _value:
    description: Integer representing the bytes from the input.
    type: int
