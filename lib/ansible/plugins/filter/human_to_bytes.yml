DOCUMENTATION:
  name: human_to_bytes
  version_added: "historical"
  short_description: Get bytes from string
  description:
    - Convert a human-readable byte or bit string into a number of bytes or bits.
    - Input must start with an ASCII decimal number, optionally followed by ASCII spaces, a unit, and trailing ASCII spaces.
    - Units may be a single size prefix, an abbreviation such as V(MB) or V(Mb), or a full name such as V(megabyte) or V(megabit).
    - Full unit names are case-insensitive. Abbreviations use V(B) for bytes and V(b) for bits, as selected by O(isbits).
    - Malformed numbers, leading whitespace, unrecognized units, and additional text produce an error.
  positional: _input, default_unit, isbits
  options:
    _input:
      description: Human-readable description of a number of bytes or bits.
      type: str
      required: true
    default_unit:
      description: Unit to assume when input does not specify it.
      type: str
      choices: ['Y', 'Z', 'E', 'P', 'T', 'G', 'M', 'K', 'B']
    isbits:
      description: If V(True), interpret the input as bits. If V(False), interpret the input as bytes.
      type: bool
      default: false
EXAMPLES: |

  # size => 1234803098
  size: '{{ "1.15 GB" | human_to_bytes }}'

  # size => 1234803098
  size: '{{ "1.15" | human_to_bytes(default_unit="G") }}'

  # this is an error, wants bits, got bytes
  ERROR: '{{ "1.15 GB" | human_to_bytes(isbits=true) }}'

RETURN:
  _value:
    description: Integer representing the bytes from the input.
    type: int
